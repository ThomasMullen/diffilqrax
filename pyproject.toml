[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "diffilqrax"
authors = [
  { name="Thomas Soares Mullen", email="thomasmullen96@gmail.com" },
  { name="Marine Schimel", email="marine.schimel@hotmail.fr" },
]
description = "Differentiable iLQR algorithm for dynamical systems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["lqr", "ilqr", "optimal control", "differentiable control", "jax"]
dependencies = [
  "jax>=0.4.25",
  "numpy",
  "jaxopt",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  # Pick your license as you wish
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
packages = ["diffilqrax"]

[project.optional-dependencies]
dev = [
  "pytest",
  "chex",
  "scipy",
  "matplotlib",
  "black",
  "pylint",
  "build",
]
doc = [
  "sphinx>=7",
  "pydata-sphinx-theme",
  "sphinx-autodoc-typehints",
  "sphinx-gallery",
  "sphinx-design",
  "sphinxcontrib-bibtex",
  "nbsphinx",
  "ipykernel",
  "matplotlib",
  "optax",  # used by the gradient-descent comparison notebook
]

[tool.setuptools.dynamic]
version = {file = "diffilqrax/VERSION"}

[tool.setuptools.package-data]
diffilqrax = ["VERSION"]

[project.urls]
"Homepage" = "https://github.com/ThomasMullen/diffilqrax"
"Documentation" = "https://thomasmullen.github.io/diffilqrax/"
"Bug Tracker" = "https://github.com/ThomasMullen/diffilqrax/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fig_dump", ".*", "venv", "build", "dist"]
markers = ["slow: large-dimension tests (deselect with '-m \"not slow\"')"]

[tool.black]
line-length = 127
