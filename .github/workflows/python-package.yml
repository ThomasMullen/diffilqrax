name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier: quick (CI default), full (adds the heavy cases) or all (adds the slow large-dimension tests too)"
        type: choice
        options: [quick, full, all]
        default: quick

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      TIER: ${{ inputs.tier || 'quick' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Test with pytest
        run: |
          case "$TIER" in
            quick) MARKERS="not slow and not heavy" ;;
            full) MARKERS="not slow" ;;
            all) MARKERS="" ;;
          esac
          python -m pytest tests/ -m "$MARKERS" --durations=15
