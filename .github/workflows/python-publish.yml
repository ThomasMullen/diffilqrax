# Builds the sdist and wheel and uploads them to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: the "pypi" environment of this repository must be registered as a
# trusted publisher of the diffilqrax project on PyPI.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/diffilqrax
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build package
        run: uv build
      - name: Publish package
        run: uv publish --trusted-publishing always
